name: Native updater isolation
on:
  workflow_dispatch:
  push:
    branches: [feature/unified-rpg-automatic-gm]
    paths:
      - 'tests/test_update_build_launcher.py'
      - 'scripts/update_and_build.ps1'
      - '.github/workflows/updater-windows.yml'
permissions:
  contents: read
jobs:
  updater:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m pytest tests/test_update_build_launcher.py -q
