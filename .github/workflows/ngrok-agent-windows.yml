name: Native ngrok recovery
on:
  workflow_dispatch:
  push:
    branches: [feature/unified-rpg-automatic-gm]
    paths:
      - 'scripts/ngrok_*.py'
      - 'tests/test_ngrok*.py'
      - '.github/workflows/ngrok-agent-windows.yml'
permissions:
  contents: read
jobs:
  recovery:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Regression tests
        run: python -m pytest tests/test_ngrok_download.py tests/test_ngrok_version.py tests/test_ngrok_host.py tests/test_ngrok_transport.py -q
      - name: Verify actual official publisher and executable version
        run: |
          python -c "from pathlib import Path; from scripts.ngrok_host import update_agent,require_supported; root=Path('build/ngrok-native-probe/host').resolve(); old=root/'ngrok-agent/.ngrok.exe.old'; old.parent.mkdir(parents=True,exist_ok=True); old.write_bytes(b'legacy-backup'); update_agent(root); update_agent(root); assert old.read_bytes()==b'legacy-backup'; print('Verified official ngrok after two updates:',require_supported(str(root/'ngrok-agent/ngrok.exe')))"
      - name: Verify real Windows HTTPS fallback and installed signature
        run: |
          python -c "from pathlib import Path; from unittest.mock import patch; from scripts.ngrok_host import update_agent,require_supported; root=Path('build/ngrok-windows-https-probe').resolve(); transport='scripts.ngrok_download.urllib.request.urlopen'; failure=OSError('Simulated Python transport failure'); ctx=patch(transport,side_effect=failure); ctx.start(); update_agent(root); ctx.stop(); print('Verified Windows HTTPS fallback:',require_supported(str(root/'ngrok-agent/ngrok.exe')))"
      - name: Public binary signature diagnostics on failure
        if: failure()
        shell: powershell
        run: |
          python -c "from pathlib import Path; import urllib.request,zipfile,io; from scripts.ngrok_download import URL,MAX_ARCHIVE; b=urllib.request.urlopen(URL,timeout=30).read(MAX_ARCHIVE+1); assert len(b)<=MAX_ARCHIVE; z=zipfile.ZipFile(io.BytesIO(b)); p=Path('build/ngrok-native-probe/diagnostic.exe'); p.parent.mkdir(parents=True,exist_ok=True); p.write_bytes(z.read('ngrok.exe')); print('Downloaded bytes:',len(b))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $file = (Resolve-Path 'build/ngrok-native-probe/diagnostic.exe').Path
          $signature = Get-AuthenticodeSignature -LiteralPath $file
          Write-Host 'Authenticode status:' $signature.Status
          Write-Host 'Authenticode message:' $signature.StatusMessage
          if ($signature.SignerCertificate) {
            Write-Host 'Public publisher:' $signature.SignerCertificate.GetNameInfo([System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false)
          }
