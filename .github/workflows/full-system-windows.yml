name: Full RPG Windows validation
on:
  workflow_dispatch:
  pull_request:
    branches: [main, feature/unified-rpg-automatic-gm]
    paths: ['src/**', 'tests/**', 'data/**', 'scripts/**', 'training/**', 'requirements*', 'pyproject.toml', 'DND-NCFU.spec', 'installer/**', '.github/workflows/full-system-windows.yml']
  push:
    branches: [feature/unified-rpg-automatic-gm]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'data/**'
      - 'scripts/**'
      - 'training/**'
      - '.github/workflows/**'
      - 'requirements*'
      - 'pyproject.toml'
      - 'DND-NCFU.spec'
      - 'installer/**'
permissions:
  contents: read
  actions: read
jobs:
  launchers:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Actual PowerShell update against isolated local Git repositories
        run: python -m pytest tests/test_update_build_launcher.py -q
  dpi:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scale: ['1', '1.25', '1.5', '2']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Native Windows widgets at selected Qt scale
        env:
          QT_SCALE_FACTOR: ${{ matrix.scale }}
        run: python -m pytest tests/test_catalog_ui_playable.py tests/test_unified_creation.py tests/test_catalog_campaign.py tests/test_contracts.py -q
  preflight:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Save encoding and real application startup
        run: python -m pytest tests/test_campaign_skills.py tests/test_desktop_release.py -x -q
  setup:
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          architecture: x64
      - name: Build portable and Windows Setup
        shell: powershell
        run: |
          & .\scripts\build_windows.ps1 -Installer -Profile developer -TextModel 'deepseek/deepseek-v4.1-flash'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: e6bb2373247873ae4074700259ea56e163faf2ec
          path: build/previous-source
      - name: Download the previously validated 0.3.1 installer
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 40609470324 --repo sayferst/DND-NCFU --name full-system-native-windows --dir build/previous-native
          if ($LASTEXITCODE -ne 0) { throw 'Historical installer download failed.' }
      - name: Install, launch, update and check isolated data
        shell: powershell
        run: .\scripts\probe_windows_setup.ps1 -PreviousInstaller build\previous-native\dist\DND-NCFU-Setup.exe -PreviousSource build\previous-source
      - name: Upload package and actual reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: full-system-native-windows
          path: |
            dist/DND-NCFU-Setup.exe
            dist/DND-NCFU-Windows-x64-v*.zip
            dist/DND-NCFU-Windows-x64-v*.zip.sha256
            build/windows-*/checks/*.json
            build/setup-probe/*.json
            build/check-batches-*/summary.json
          if-no-files-found: warn
          retention-days: 14
